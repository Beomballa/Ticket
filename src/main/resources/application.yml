spring:
  application:
    name: fan-event-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fan_event}
    username: ${DB_USERNAME:fan_event}
    password: ${DB_PASSWORD:fan_event}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  flyway:
    enabled: true
  docker:
    compose:
      lifecycle-management: start-only

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      access: unrestricted

server:
  shutdown: graceful

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level traceId=%X{traceId:-} [%thread] %logger{36} - %msg%n"

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  cache:
    public-event:
      enabled: true
      ttl: PT5M
      key-prefix: "cache:event-detail:v1:"
  idempotency:
    ttl: PT24H
  outbox:
    enabled: true
    initial-delay: PT10S
    fixed-delay: PT1S
    batch-size: 20
    processing-timeout: PT30S
    max-attempts: 5
    base-retry-delay: PT1S
    max-retry-delay: PT1M
  payment:
    webhook:
      secret: ${PG_WEBHOOK_SECRET:local-webhook-signing-key}
      timestamp-tolerance: PT5M
      processing-timeout: PT30S
    reconciliation:
      enabled: true
      initial-delay: PT30S
      fixed-delay: PT10S
      batch-size: 20
      processing-timeout: PT30S
      base-retry-delay: PT10S
      max-retry-delay: PT10M
      metrics-interval: PT10S
  reservation:
    hold-ttl: PT10M
    expiration:
      enabled: true
      initial-delay: PT10S
      fixed-delay: PT1S
      batch-size: 50
    rate-limit:
      enabled: true
      limit: 20
      window: PT1M
      key-prefix: "rate-limit:reservation:v1:"
  security:
    jwt:
      secret: ${JWT_SECRET:local-development-secret-change-me-32-bytes}
      issuer: fan-event-platform
      access-token-ttl: PT30M
