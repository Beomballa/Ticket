groups:
  - name: fan-event-platform
    rules:
      - alert: FanEventHighApiErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: API 5xx 비율이 5%를 초과했습니다.
          runbook: docs/runbooks/incident-response.md

      - alert: FanEventHighApiP95Latency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 전체 API p95가 500ms를 초과했습니다.
          runbook: docs/runbooks/incident-response.md

      - alert: FanEventDatabaseConnectionPending
        expr: sum(hikaricp_connections_pending) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: DB 연결 대기가 2분 이상 지속되고 있습니다.
          runbook: docs/runbooks/incident-response.md

      - alert: FanEventDatabaseConnectionTimeout
        expr: sum(increase(hikaricp_connections_timeout_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: DB 커넥션 풀 획득 타임아웃이 발생했습니다.
          runbook: docs/runbooks/incident-response.md

      - alert: FanEventOutboxBacklog
        expr: sum(fan_event_outbox_backlog{status=~"pending|failed|processing"}) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 처리 대기 Outbox 이벤트가 100건을 초과했습니다.
          runbook: docs/runbooks/incident-response.md

      - alert: FanEventOutboxDeliveryFailure
        expr: sum(rate(fan_event_outbox_delivery_total{result="failed"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Outbox 소비 실패가 지속되고 있습니다.
          runbook: docs/runbooks/incident-response.md

      - alert: FanEventReservationRateLimitBurst
        expr: |
          sum(rate(fan_event_reservation_rate_limit_total{result="rejected"}[5m]))
          /
          clamp_min(sum(rate(fan_event_reservation_rate_limit_total[5m])), 0.001)
          > 0.20
        for: 5m
        labels:
          severity: info
        annotations:
          summary: 예약 생성 요청 중 속도 제한 비율이 20%를 초과했습니다.
          runbook: docs/runbooks/incident-response.md

      - alert: FanEventPaymentReconciliationStale
        expr: fan_event_payment_reconciliation_oldest_age_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 결제 결과 불명 건이 5분 넘게 해소되지 않고 있습니다.
          runbook: docs/runbooks/incident-response.md

      - alert: FanEventPaymentAuthorizationRecoverySpike
        expr: sum(increase(fan_event_payment_authorization_claim_total{result="recovered_unknown"}[5m])) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 처리 유예시간이 지난 결제 승인 요청의 복구가 급증했습니다.
          runbook: docs/runbooks/incident-response.md

      - alert: FanEventRefundReconciliationStale
        expr: fan_event_refund_reconciliation_oldest_age_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 환불 결과 불명 건이 5분 넘게 해소되지 않고 있습니다.
          runbook: docs/runbooks/incident-response.md

      - alert: FanEventRefundExecutionRecoverySpike
        expr: sum(increase(fan_event_refund_execution_claim_total{result="recovered_unknown"}[5m])) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 처리 유예시간이 지난 환불 요청의 복구가 급증했습니다.
          runbook: docs/runbooks/incident-response.md

      - alert: FanEventLatePaymentCompensationStale
        expr: fan_event_payment_compensation_oldest_age_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 늦은 승인 보상 환불이 5분 넘게 해소되지 않고 있습니다.
          runbook: docs/runbooks/incident-response.md

      - alert: FanEventWaitingRoomPolicySyncFailure
        expr: increase(fan_event_waiting_room_total{operation="policy_sync",result="redis_error"}[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 대기열 영속 정책을 Redis 런타임에 동기화하지 못했습니다.
          runbook: docs/runbooks/incident-response.md
